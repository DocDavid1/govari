<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ההזמנה התקבלה | גוב ארי מערכות</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="assets/images/favicon.png" />
  <link rel="stylesheet" href="css/styles.css" />
  <script>document.documentElement.setAttribute('data-theme','dark');</script>
</head>
<body>
  <a href="#content" class="skip-link">דלג לתוכן</a>
  <header class="site-header solid">
    <nav class="nav container">
      <a class="brand" href="index.html" aria-label="גוב ארי מערכות">
        <img class="brand-logo" src="assets/images/logo-govari-mark.png" alt="גוב ארי מערכות — מערכות מצלמות רכב" />
      </a>
      <div class="nav-cta" style="margin-inline-start:auto">
        <a class="nav-tel" href="tel:0536813013">053-6813013</a>
      </div>
    </nav>
  </header>

  <main id="content">
    <section class="section" style="min-height:70vh;display:flex;align-items:center">
      <div class="container center" style="max-width:640px">
        <div style="width:88px;height:88px;border-radius:50%;margin:0 auto 1.5rem;display:grid;place-items:center;
             background:linear-gradient(135deg,rgba(231,200,119,.22),rgba(201,162,78,.10));border:1px solid var(--line-2)">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="var(--gold-2)" stroke-width="2.2"><path d="M20 6L9 17l-5-5"/></svg>
        </div>
        <p class="eyebrow">תודה!</p>
        <h1 id="title" style="font-size:clamp(2rem,4.4vw,3rem)">ההזמנה התקבלה</h1>
        <p class="lead" id="msg" style="margin-inline:auto">קיבלנו את הזמנתך ושלחנו אישור למייל. <b>לא בוצע חיוב.</b> ניצור איתך קשר בהקדם לתיאום — והתשלום רק אחרי שתאשר/י.</p>
        <p style="color:var(--muted);margin-top:1rem">מספר הזמנה: <b id="orderId">—</b></p>
        <div class="hero-cta" style="justify-content:center;margin-top:1.8rem">
          <a class="btn btn-primary btn-lg" href="index.html">חזרה לאתר</a>
          <a class="btn btn-ghost btn-lg" href="https://wa.me/972536813013" target="_blank" rel="noopener">וואטסאפ</a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom" style="border-top:0;margin-top:0;padding-top:0">
        <span>© <span id="year"></span> גוב ארי מערכות. כל הזכויות שמורות.</span>
        <span><a href="tel:0536813013" style="color:inherit">053-6813013</a></span>
      </div>
    </div>
  </footer>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
    var params = new URLSearchParams(location.search);
    var id = params.get('order');
    if (id) document.getElementById('orderId').textContent = id;
    // בדיקת סטטוס (אם השרת פעיל) — עדכון הודעה אם שולם
    if (id) {
      fetch('/api/orders/' + encodeURIComponent(id)).then(function (r) { return r.ok ? r.json() : null; })
        .then(function (d) {
          if (d && d.status === 'paid') {
            document.getElementById('title').textContent = 'התשלום התקבל — תודה!';
            document.getElementById('msg').textContent = 'התשלום עבר בהצלחה ואישור נשלח למייל שלך. נתחיל לטפל בהזמנה מיד.';
          }
        }).catch(function () {});
    }
  </script>
</body>
</html>
